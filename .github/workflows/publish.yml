name: Post new stories to X and Instagram

on:
  push:
    branches: [main]
    paths: [index.html]
  schedule:
    - cron: "23 * * * *"      # hourly: post the next waiting story, if any
    - cron: "17 9 1,15 * *"   # twice a month: renew the Instagram token before its 60 days run out
  workflow_dispatch:
    inputs:
      story:
        description: "Story to re-render, e.g. no-16 (blank = only stories not yet posted)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: draw the images, post nothing"
        type: boolean
        default: true
      check_only:
        description: "Only check that the X and Instagram keys work; post nothing"
        type: boolean
        default: false
      reel:
        description: "Story to render as a reel, e.g. no-19 (new stories get one automatically)"
        required: false
        default: ""
      story_reel:
        description: "Post this story's reel as an Instagram Story, e.g. no-19"
        required: false
        default: ""

# One run at a time, so two quick pushes can't post the same story twice.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renew-instagram-token:
    if: github.event.schedule == '17 9 1,15 * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Renew the Instagram token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: node scripts/publish.js refresh

  publish:
    if: github.event_name != 'schedule' || github.event.schedule == '23 * * * *'
    runs-on: ubuntu-24.04
    env:
      MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
      # A manual run follows its own switch; a push follows the repository
      # variable SOCIAL_PAUSED (unset = live, as long as the keys exist). Without keys it is always a dry run.
      SOCIAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || format('{0}', vars.SOCIAL_PAUSED) }}
      FORCE_STORY: ${{ inputs.story }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve main after acquiring the workflow concurrency lock. The event SHA
          # can predate the previous run's ledger commit when this run was queued.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the keys
        if: inputs.check_only == true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish.js check

      - name: Install Playwright
        if: inputs.check_only != true
        timeout-minutes: 14
        # Each command is given a few minutes and retried, because a stalled download has twice
        # hung this step for good. The runner image already carries Chromium's libraries, so no
        # apt step; if the browser download keeps failing, the image's own Chrome is used instead.
        run: |
          npm config set fetch-retries 5 fetch-retry-mintimeout 10000 fetch-timeout 60000
          for i in 1 2 3; do timeout 150 npm install --no-audit --no-fund && break; echo "::warning::npm install, attempt $i, failed or hung"; sleep 5; done
          test -d node_modules/playwright || { echo "::error::npm install failed three times"; exit 1; }
          ok=
          for i in 1 2 3; do timeout 200 npx playwright install chromium && { ok=1; break; }; echo "::warning::browser download, attempt $i, failed or hung"; sleep 5; done
          if [ -z "$ok" ]; then
            chrome=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
            [ -n "$chrome" ] || { echo "::error::no browser could be installed or found"; exit 1; }
            echo "PW_EXEC=$chrome" >> "$GITHUB_ENV"; echo "::warning::using the runner's own browser at $chrome"
          fi

      - name: Serve the site
        if: inputs.check_only != true
        run: |
          nohup python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sfo /dev/null http://127.0.0.1:8080/index.html && break; sleep 1; done
          curl -sfo /dev/null http://127.0.0.1:8080/index.html

      - name: Draw the share images
        if: inputs.check_only != true
        run: node scripts/publish.js render

      - name: Make reels
        if: inputs.check_only != true
        timeout-minutes: 15
        continue-on-error: true # a reel that fails must not hold up the posts; render it by hand with the reel input
        env:
          REEL: ${{ inputs.reel }}
        run: node scripts/reel.js $REEL

      - name: Push the images and reels (Instagram fetches its copy; the pages use the previews)
        if: inputs.check_only != true
        run: |
          git config user.name "legacymammals"
          git config user.email "legacymammals@users.noreply.github.com"
          git add social/*.png og/*.png reels/*.mp4 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Share images, link previews, reels" && git pull --rebase && git push)

      - name: Post
        if: inputs.check_only != true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish.js post

      - name: Post a reel as an Instagram story
        if: inputs.story_reel != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          STORY_REEL: ${{ inputs.story_reel }}
        run: node scripts/publish.js story $STORY_REEL

      - name: Keep the publishing ledger for recovery
        if: always() && inputs.check_only != true
        uses: actions/upload-artifact@v4
        with:
          name: publishing-ledger
          path: social/posted.json
          if-no-files-found: error

      - name: Record what went out
        if: always() && inputs.check_only != true
        run: |
          git config user.name "legacymammals"
          git config user.email "legacymammals@users.noreply.github.com"
          git add social/posted.json
          git diff --cached --quiet || (git commit -m "Record posted stories" && git pull --rebase && git push)

      - name: Keep the images with the run
        if: always() && inputs.check_only != true
        uses: actions/upload-artifact@v4
        with:
          name: share-images
          path: |
            social/*.png
            og/*.png
          if-no-files-found: ignore
