name: Post new stories to X and Instagram

on:
  push:
    branches: [main]
    paths: [index.html]
  schedule:
    - cron: "23 * * * *"      # hourly: post the next waiting story, if any
    - cron: "17 9 1,15 * *"   # twice a month: renew the Instagram token before its 60 days run out
  workflow_dispatch:
    inputs:
      story:
        description: "Story to re-render, e.g. no-16 (blank = only stories not yet posted)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: draw the images, post nothing"
        type: boolean
        default: true
      check_only:
        description: "Only check that the X and Instagram keys work; post nothing"
        type: boolean
        default: false
      reel:
        description: "Story to render as a reel, e.g. no-19 (new stories get one automatically)"
        required: false
        default: ""

# One run at a time, so two quick pushes can't post the same story twice.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renew-instagram-token:
    if: github.event.schedule == '17 9 1,15 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Renew the Instagram token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: node scripts/publish.js refresh

  publish:
    if: github.event_name != 'schedule' || github.event.schedule == '23 * * * *'
    runs-on: ubuntu-latest
    env:
      MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
      # A manual run follows its own switch; a push follows the repository
      # variable SOCIAL_PAUSED (unset = live, as long as the keys exist). Without keys it is always a dry run.
      SOCIAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || format('{0}', vars.SOCIAL_PAUSED) }}
      FORCE_STORY: ${{ inputs.story }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the keys
        if: inputs.check_only == true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish.js check

      - name: Install Playwright
        if: inputs.check_only != true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Serve the site
        if: inputs.check_only != true
        run: |
          nohup python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sfo /dev/null http://127.0.0.1:8080/index.html && break; sleep 1; done
          curl -sfo /dev/null http://127.0.0.1:8080/index.html

      - name: Draw the share images
        if: inputs.check_only != true
        run: node scripts/publish.js render

      - name: Make reels
        if: inputs.check_only != true
        env:
          REEL: ${{ inputs.reel }}
        run: |
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          node scripts/reel.js $REEL

      - name: Push the images and reels (Instagram fetches its copy; the pages use the previews)
        if: inputs.check_only != true
        run: |
          git config user.name "legacymammals"
          git config user.email "legacymammals@users.noreply.github.com"
          git add social/*.png og/*.png reels/*.mp4 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Share images, link previews, reels" && git pull --rebase && git push)

      - name: Post
        if: inputs.check_only != true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish.js post

      - name: Record what went out
        if: inputs.check_only != true
        run: |
          git config user.name "legacymammals"
          git config user.email "legacymammals@users.noreply.github.com"
          git add social/posted.json
          git diff --cached --quiet || (git commit -m "Record posted stories" && git pull --rebase && git push)

      - name: Keep the images with the run
        if: always() && inputs.check_only != true
        uses: actions/upload-artifact@v4
        with:
          name: share-images
          path: |
            social/*.png
            og/*.png
          if-no-files-found: ignore
