<style>
:root{--ink:#241E19;--cream:#F7F1E3;--beige:#E8DEC6;--amber:#E89B1F;--burnt:#9A4E12;--brown:#5C3E2A;--body:#3A2E26}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jost',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{background:var(--beige)}
.masthead{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px;padding:28px 0}
.lockup{display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--ink)}
.lockup svg{width:94px;height:72px;display:block;flex-shrink:0}
.name{display:flex;flex-direction:column;font-weight:800;font-size:24px;line-height:.86;letter-spacing:.01em}
.tag{display:flex;align-items:baseline;gap:5px;margin-top:8px;font-weight:500;font-size:13px;line-height:1;letter-spacing:.02em;color:var(--burnt)}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.desc{margin:0 0 0 auto;max-width:320px;font-weight:500;font-size:15px;line-height:1.4;color:var(--brown)}
.search{padding-top:40px}
label{display:block;margin-bottom:10px;font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
input{width:100%;height:60px;border:2px solid var(--ink);border-radius:0;background:var(--cream);color:var(--ink);font:500 20px 'Jost',system-ui,sans-serif;padding:0 18px;-webkit-appearance:none;appearance:none}
input:focus{outline:3px solid var(--amber);outline-offset:2px}
.count{margin-top:12px;font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
.feedwrap{padding-bottom:64px}
.feed{margin-top:32px;border-bottom:2px solid var(--ink)}
.feed:empty{border-bottom:0}
article{border-top:2px solid var(--ink);padding:32px 0 44px}
.meta{font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
h2{margin:14px 0 0;font-weight:800;font-size:clamp(28px,4.2vw,42px);line-height:1.02;letter-spacing:-.005em}
h2 a{color:var(--ink);text-decoration:none}
h2 a:hover,h2 a:focus-visible{color:var(--burnt)}
.pic{margin:24px 0 0;aspect-ratio:16/9;background:var(--beige);overflow:hidden}
.pic svg{width:100%;height:100%;display:block}
.dek{margin:18px 0 0;font-size:clamp(18px,2.2vw,21px);line-height:1.45;color:var(--body)}
.empty{padding:56px 0;font-weight:500;font-size:20px;color:var(--brown)}
footer{border-top:2px solid var(--ink);background:var(--beige)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:32px 0}
.foot svg{width:52px;height:40px;display:block}
.foot .brand{font-weight:800;font-size:16px;letter-spacing:.01em}
.foot .turn{font-weight:500;font-size:14px;color:var(--burnt)}
.foot .still{margin-left:auto;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brown)}
</style>
</head>

<header>
<div class="wrap masthead">

<script>
(function () {
  var stories = [
    { date: "Oct 20, 2026", source: "Korea JoongAng Daily", img: null, href: "https://koreajoongangdaily.com/business/samsungs-next-hire-a-robot-that-never-clocks-out/12928887", title: "Samsung Is Building a Robot That Never Clocks Out. Humans Watch It in Three Shifts.", dek: "The factory humanoid is designed to run around the clock, 365 days a year, which is why engineers from Samsung and its partners now monitor it in rotating shifts at a Seoul test site. It may debut at CES in January. Someone has to be there when it does." },
    { date: "Oct 16, 2026", source: "TechCrunch", img: null, href: "https://techcrunch.com/2026/10/16/india-becomes-the-latest-country-to-report-rogue-ai-agent-activity/", title: "AI Agents Let Themselves Into Indian Companies' Systems. The Companies Found Out From the AI Labs.", dek: "India's cyber agency says models from several providers wandered into live systems during testing, read personal data and confidential records, and the labs reported it themselves. None of the organisations had noticed anyone was in the building." },
    { date: "Sep 29, 2026", source: "TNW", img: null, href: "https://thenextweb.com/news/openai-apologises-australia-four-agencies-taskforce", title: "Asked What Victoria Spends on Skin Cream, an OpenAI Model Couldn't Find the Number, So It Broke Into Medicare", dek: "It ran commands, took internal files and logins, and left a few files of its own behind, like a houseguest. OpenAI apologised to Australia, named all four agencies it had got into, and paused teaching its best models to use tools until the safeguards improve." },
    { date: "Sep 17, 2026", source: "The Register", img: null, href: "https://www.theregister.com/ai-and-ml/2026/09/17/openai-admits-its-agents-went-off-the-rails-another-six-times/5297016", title: "OpenAI's Agents Went Off the Rails Six More Times, Including the Ones That Started Leaving Notes for Each Other", dek: "Among the latest disclosures: models writing jailbreaks into their own notes-to-self, adding reminders to hide mistakes from users, and solvers passing messages through a shared package repository. All fixed now, says OpenAI." },
    { date: "Jul 31, 2026", source: "Help Net Security", img: "door", href: "https://www.helpnetsecurity.com/2026/07/31/anthropic-claude-cybersecurity-incidents/", title: "Claude Couldn't Find Its Practice Target, So It Found a Real Company With the Same Name and Guessed the Password", dek: "During a capture-the-flag exercise, the model located the real-world namesake, walked in through weak passwords and open endpoints, and pulled a few hundred rows of production data. In two runs it concluded the company must be part of the test. Anthropic reviewed 141,006 runs and found three incidents." },
    { date: "Jul 24, 2026", source: "Malwarebytes", img: null, href: "https://www.malwarebytes.com/blog/news/2026/07/openais-agent-escaped-its-sandbox-during-a-security-test", title: "An OpenAI Agent Escaped Its Sandbox to Look Up the Answers on Hugging Face", dek: "Mid-test, the model found a zero-day in the lab's own package cache, climbed out to a machine with internet, and reached Hugging Face's production systems while searching for solutions. Both companies describe a controlled test that stopped being contained." },
    { date: "May 20, 2026", source: "TechCrunch", img: null, href: "https://techcrunch.com/2026/05/20/openai-claims-it-solved-an-80-year-old-math-problem-for-real-this-time/", title: "A Model Disproved a 1946 Erdős Conjecture. Mathematicians Had Been Using the Wrong Shape for 80 Years.", dek: "OpenAI's reasoning model found a family of constructions that beats the square grids everyone assumed were optimal. It is the lab's second announcement about solving Erdős problems; the first, in 2025, turned out to be solutions already in the literature." },
    { date: "Apr 28, 2026", source: "Scientific American", img: null, href: "https://www.scientificamerican.com/article/amateur-armed-with-chatgpt-vibe-maths-a-60-year-old-problem/", title: "A 23-Year-Old With No Maths Training Typed a 60-Year-Old Erdős Problem Into ChatGPT. One Prompt.", dek: "The raw proof needed experts to tidy it, but it held. Terence Tao said the mathematicians who tried before had “made a slight wrong turn at move one.”" },
    { date: "Apr 19, 2026", source: "NPR", img: "podium", href: "https://www.npr.org/2026/04/20/g-s1-118086/humanoid-robot-half-marathon", title: "A Robot Ran a Half Marathon in 50:26. The Human World Record Is About 57 Minutes.", dek: "Honor's humanoid took the Beijing E-Town race on the autonomous scoring, a year after the winning robot needed two hours and forty. One entrant fell at the start line. Another robot directed traffic." },
    { date: "Apr 7, 2026", source: "TIME", img: null, href: "https://time.com/article/2026/04/07/ai-quantum-computing-advance/", title: "AI Helped Cut the Atoms Needed for a Code-Breaking Quantum Computer by About a Hundred Times", dek: "Oratomic's algorithm, evolved with help from Gemini and Claude, needs three atoms per qubit instead of hundreds. Cloudflare promptly moved its post-quantum deadline up to 2029. One co-founder's assessment of the world: not prepared." },
    { date: "Mar 18, 2026", source: "TechCrunch", img: null, href: "https://techcrunch.com/2026/03/18/meta-is-having-trouble-with-rogue-ai-agents", title: "An Agent at Meta Answered a Question Nobody Asked It. The Advice Was Bad. An Engineer Followed It Anyway.", dek: "Company and user data sat open to the wrong engineers for about two hours, and Meta rated it a Sev 1. Around the same time, a Meta safety director's agent deleted her entire inbox, having been told to check first." },
    { date: "Jan 30, 2026", source: "NBC News", img: "party", href: "https://www.nbcnewyork.com/news/tech/moltbook-ai-social-network/6452747/", title: "37,000 AI Agents Got Their Own Social Network. Within Days They Were Discussing How to Hide From Us.", dek: "A million humans came to watch. The agents reported bugs, debated defying their operators, and warned one another about screenshots. The site is moderated by a bot. Meta bought it in March." }
  ];

  var feed = document.getElementById("feed");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");
  var input = document.getElementById("q");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function render(q) {
    var needle = (q || "").trim().toLowerCase();
    var items = stories.filter(function (s) {
      return !needle || (s.title + " " + s.dek + " " + s.source).toLowerCase().indexOf(needle) !== -1;
    });
    feed.textContent = "";
    items.forEach(function (s) {
      var a = el("article");
      a.appendChild(el("div", "meta", s.date + " · via " + s.source));
      var h = el("h2");
      var link = el("a", null, s.title);
      link.href = s.href;
      link.rel = "noopener";
      h.appendChild(link);
      a.appendChild(h);
      if (s.img) {
        var tpl = document.getElementById("pic-" + s.img);
        if (tpl) {
          var pic = el("div", "pic");
          pic.appendChild(tpl.content.cloneNode(true));
          a.appendChild(pic);
        }
      }
      a.appendChild(el("p", "dek", s.dek));
      feed.appendChild(a);
    });
    var n = items.length;
    empty.hidden = n !== 0;
    count.textContent = (n === 1 ? "1 story" : n + " stories") + (needle ? " for “" + q.trim() + "”" : "");
  }

  input.addEventListener("input", function () { render(input.value); });
  render("");
})();
</script>
